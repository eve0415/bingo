[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/eve0415/bingo"

[workspace.dependencies]
rand_core = "=0.9.5"
rand_chacha = "=0.9.0"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
wasm-bindgen = "=0.2.127"
bingo-board = { path = "crates/bingo-board" }
bingo-core = { path = "crates/bingo-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
